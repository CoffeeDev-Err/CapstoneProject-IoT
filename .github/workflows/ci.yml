name: Verify

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bantaycabagan-mobileapp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix bantaycabagan-mobileapp
      - run: npm run check
